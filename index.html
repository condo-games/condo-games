<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b18" />
    <title>Join Discord</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090b18;
        color: #fff;
      }

      * { box-sizing: border-box; }

      html, body { min-width: 100%; min-height: 100%; margin: 0; }

      body {
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(81, 104, 255, .32), transparent 23rem),
          radial-gradient(circle at 15% 15%, rgba(0, 205, 255, .15), transparent 20rem),
          radial-gradient(circle at 90% 88%, rgba(173, 72, 255, .18), transparent 24rem),
          #090b18;
      }

      a { -webkit-tap-highlight-color: transparent; }

      .invite-page {
        position: relative;
        display: grid;
        min-height: 100vh;
        overflow: hidden;
        place-items: center;
        padding: 24px;
        isolation: isolate;
      }

      .invite-page::before {
        position: absolute;
        z-index: -1;
        width: 170vw;
        height: 170vw;
        max-width: 1500px;
        max-height: 1500px;
        border: 1px solid rgba(139, 154, 255, .08);
        border-radius: 34%;
        content: "";
        transform: rotate(24deg);
        box-shadow: 0 0 0 34px rgba(139, 154, 255, .025), 0 0 0 68px rgba(139, 154, 255, .018);
      }

      .invite-page::after {
        position: absolute;
        z-index: -1;
        inset: 0;
        background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
        background-size: 38px 38px;
        content: "";
        mask-image: linear-gradient(to bottom, transparent, black 22%, black 78%, transparent);
        opacity: .65;
      }

      .invite-content {
        display: flex;
        width: min(100%, 330px);
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }

      .invite-avatar {
        width: 142px;
        height: 142px;
        border: 4px solid rgba(255,255,255,.92);
        border-radius: 30px;
        object-fit: cover;
        box-shadow: 0 0 0 7px rgba(83,103,255,.32), 0 0 34px rgba(83,103,255,.48), 0 20px 48px rgba(0,0,0,.48);
        animation: avatar-in 520ms cubic-bezier(.23,1,.32,1) both;
      }

      .discord-button {
        display: inline-flex;
        width: 100%;
        min-height: 56px;
        align-items: center;
        justify-content: center;
        border: 2px solid rgba(255,255,255,.82);
        border-radius: 16px;
        background: linear-gradient(135deg, #7280ff 0%, #5865f2 54%, #7a4dff 100%);
        color: #fff;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: .01em;
        text-decoration: none;
        text-shadow: 0 1px 2px rgba(0,0,0,.24);
        box-shadow: 0 0 0 5px rgba(88,101,242,.18), 0 16px 32px rgba(73,83,224,.4), inset 0 2px 0 rgba(255,255,255,.28);
        transition: transform 160ms cubic-bezier(.23,1,.32,1), box-shadow 160ms cubic-bezier(.23,1,.32,1), filter 160ms ease;
        animation: button-in 520ms 80ms cubic-bezier(.23,1,.32,1) both;
      }

      .discord-button:hover {
        filter: brightness(1.1) saturate(1.08);
        box-shadow: 0 0 0 7px rgba(88,101,242,.22), 0 20px 38px rgba(73,83,224,.52), inset 0 2px 0 rgba(255,255,255,.32);
        transform: translateY(-3px);
      }

      .discord-button:focus-visible, .invite-url:focus-visible {
        outline: 3px solid #aeb6ff;
        outline-offset: 5px;
      }

      .discord-button:active { transform: scale(.97); }

      .invite-url {
        max-width: 100%;
        overflow: hidden;
        color: rgba(224,228,255,.72);
        font-size: 12px;
        line-height: 1.4;
        text-overflow: ellipsis;
        text-decoration: none;
        white-space: nowrap;
        transition: color 160ms ease, transform 160ms ease;
        animation: url-in 520ms 140ms cubic-bezier(.23,1,.32,1) both;
      }

      .invite-url:hover { color: #fff; transform: translateY(-1px); }

      @keyframes avatar-in {
        from { opacity: 0; transform: translateY(10px) scale(.94) rotate(-2deg); }
        to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
      }

      @keyframes button-in {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes url-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .invite-avatar, .discord-button, .invite-url { animation: none; }
        .discord-button, .invite-url { transition: none; }
      }

      @media (max-width: 480px) {
        .invite-avatar { width: 130px; height: 130px; }
        .invite-content { width: min(100%, 290px); gap: 24px; }
        .invite-url { font-size: 11px; }
      }
    </style>
  </head>

    <script>
      const button = document.querySelector(".discord-button");
      const storageKey = "discord_invite_clicks";

      button.addEventListener("click", () => {
        const totalClicks = Number(localStorage.getItem(storageKey) || "0") + 1;
        localStorage.setItem(storageKey, String(totalClicks));
        console.info("Discord invite clicked", {
          totalClicks,
          timestamp: new Date().toISOString(),
        });
      });
    </script>
