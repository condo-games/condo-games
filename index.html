<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="CONDO GAME">
  <title>CONDO GAME 🍥</title>

  <style>
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:#1a1a2e}
body{min-height:100vh;overflow-x:hidden;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);color:#fff;font-family:"Comic Sans MS",cursive,sans-serif}
.kawaii-page{min-height:100vh;position:relative;overflow:hidden;padding:20px;background:linear-gradient(135deg,rgba(26,26,46,.92),rgba(22,33,62,.94))}
.kawaii-container{max-width:500px;margin:0 auto;position:relative;z-index:10}
.more-games-container{text-align:right;margin-bottom:20px}
.more-games-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:linear-gradient(145deg,#ff9cda 0%,#ff70b8 100%);color:#fff;border:0;border-radius:30px;cursor:pointer;font-weight:bold;font-family:"Arial Black",Impact,sans-serif;font-size:14px;box-shadow:0 4px 0 rgba(179,71,127,.5);transition:.3s ease}
.more-games-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(179,71,127,.5)}
.header{text-align:center;margin-bottom:25px;position:relative}
.profile-container{position:relative;display:inline-block;margin-bottom:15px}
.profile-pic{width:150px;height:150px;object-fit:cover;border:4px solid #ff9cda;border-radius:20px;box-shadow:0 0 15px rgba(255,156,218,.6)}
.kawaii-decoration{position:absolute;font-size:28px;z-index:5;animation:float 3s ease-in-out infinite}
.decoration-1{top:-20px;right:-15px;animation-delay:.5s}
.decoration-2{bottom:-15px;left:-20px;animation-delay:1s}
.title{font-size:24px;color:#ff9cda;text-shadow:0 0 10px rgba(255,156,218,.7);margin-bottom:5px;font-family:Arial,sans-serif;letter-spacing:1px}
.subtitle{font-size:16px;color:#ff70b8;margin-bottom:20px;font-family:Arial,sans-serif;letter-spacing:1px}
.links-container{display:flex;flex-direction:column;gap:12px;margin-bottom:30px}
.link-button{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 20px;background:linear-gradient(145deg,#ff9cda 0%,#ff479f 100%);color:#fff;text-decoration:none;border-radius:50px;border:2px solid #ff70b8;box-shadow:0 4px 0 rgba(179,71,127,.5);transition:.3s ease;font-weight:bold;position:relative;overflow:hidden;font-family:Arial,sans-serif;letter-spacing:1px}
.link-button:before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transition:.5s}
.link-button:hover:before{left:100%}
.link-button:hover{transform:translateY(-3px);box-shadow:0 7px 0 rgba(179,71,127,.5);background:linear-gradient(145deg,#ff479f 0%,#ff9cda 100%)}
.link-button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(179,71,127,.5)}
.link-emoji{font-size:20px}
.footer-note{text-align:center;padding:15px;background:rgba(37,35,72,.7);border-radius:15px;margin-top:20px;border:2px dashed #ff70b8;font-family:Arial,sans-serif;letter-spacing:1px;line-height:1.45}
.bg-decoration{position:fixed;pointer-events:none;z-index:0;font-size:24px;animation:twinkle 4s infinite}
.decor-a{top:10%;left:5%}
.decor-b{top:27%;right:7%;animation-delay:1s}
.decor-c{top:53%;left:8%;animation-delay:2s}
.decor-d{top:75%;right:10%;animation-delay:3s}
.decor-e{top:88%;left:12%;animation-delay:.5s}
.star-field{position:fixed;inset:0;pointer-events:none;z-index:1}
.star-field span{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.8);animation:twinkle 3s infinite}
.more-games-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;justify-content:center;align-items:center;padding:20px}
.more-games-modal.is-open{display:flex}
.more-games-content{background:linear-gradient(135deg,#ff9cda 0%,#ff479f 100%);width:90%;max-width:400px;border-radius:25px;padding:30px;text-align:center;position:relative;border:5px solid #fff;box-shadow:0 0 30px rgba(255,156,218,.8);animation:modalFadeIn .3s ease-out}
.modal-decoration{position:absolute;font-size:24px;animation:float 3s ease-in-out infinite}
.decoration-top-left{top:10px;left:10px}
.decoration-top-right{top:10px;right:10px;animation-delay:.5s}
.decoration-bottom-left{bottom:10px;left:10px;animation-delay:1s}
.decoration-bottom-right{bottom:10px;right:10px;animation-delay:1.5s}
.modal-title{font-size:22px;color:#fff;margin-bottom:15px;text-shadow:2px 2px 4px rgba(0,0,0,.3)}
.modal-text{color:#fff;margin-bottom:25px;font-size:16px;line-height:1.5;text-shadow:1px 1px 2px rgba(0,0,0,.3)}
.enter-group-btn{display:inline-flex;align-items:center;gap:10px;padding:12px 30px;background:#fff;color:#ff479f;text-decoration:none;border-radius:50px;font-weight:bold;font-size:16px;border:3px solid #ff70b8;transition:.3s ease}
.enter-group-btn:hover{transform:scale(1.05);box-shadow:0 5px 15px rgba(255,71,159,.4)}
.close-modal{position:absolute;top:15px;right:15px;background:transparent;border:0;color:#fff;font-size:24px;cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.close-modal:hover{background:rgba(255,255,255,.2)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes modalFadeIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@media(max-width:600px){
  .kawaii-page{padding:20px 14px}
  .profile-pic{width:120px;height:120px}
  .title{font-size:20px}
  .link-button{padding:12px 18px;font-size:14px}
  .more-games-content{width:95%;padding:20px}
  .footer-note{font-size:12px;letter-spacing:.6px}
}
  </style>
</head>

<body>
  <main class="kawaii-page">
    <div class="star-field" aria-hidden="true"></div>

    <div class="bg-decoration decor-a">🍥</div>
    <div class="bg-decoration decor-b">🌸</div>
    <div class="bg-decoration decor-c">⭐</div>
    <div class="bg-decoration decor-d">🍑</div>
    <div class="bg-decoration decor-e">✨</div>

    <div class="kawaii-container">
      <div class="more-games-container">
        <button class="more-games-btn" id="open-modal">
          <span>🎮</span> MORE GAMES
        </button>
      </div>

      <header class="header">
        <div class="profile-container">
          <img
  src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663962118206/UJMtYFIHhiMIYzDV.jpeg"
  alt="Avatar CONDO GAME"
  class="profile-pic"
>

          >
          <div class="kawaii-decoration decoration-1">✨</div>
          <div class="kawaii-decoration decoration-2">🌸</div>
        </div>

        <h1 class="title">⍣ＣＯＮＤＯ ＧＡＭＥ🍥⍣</h1>
        <p class="subtitle">Best CONDO GAMES 🌸</p>
      </header>

      <div class="links-container">
        <a href="https://roblox.com.bz/games/80576062127494/HOT-Catgirl-Obby-Surprise-at-the-end?privateServerLinkCode=41465014070745549559792493349453" class="link-button" target="_blank" rel="noopener noreferrer">
          <span class="link-emoji">🍑</span>
          <span>１° Ｇａｍｅ</span>
        </a>

        <a href="https://roblox.com.bz/games/14153443454/Meet-a-neko?privateServerLinkCode=41465014070745549559792493349453" class="link-button" target="_blank" rel="noopener noreferrer">
          <span class="link-emoji">🍑</span>
          <span>２° Ｇａｍｅ</span>
        </a>
      </div>

      <p class="footer-note">
        ＋２ Ｇａｍｅｓ<br>
        ＭＯＲＥ ＧＡＭＥＳ ＣＯＭＩＮＧ ＳＯＯＮ
      </p>
    </div>
  </main>

  <div class="more-games-modal" id="more-games-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="more-games-content">
      <button class="close-modal" id="close-modal" aria-label="Fechar">×</button>

      <div class="modal-decoration decoration-top-left">🌸</div>
      <div class="modal-decoration decoration-top-right">✨</div>
      <div class="modal-decoration decoration-bottom-left">⭐</div>
      <div class="modal-decoration decoration-bottom-right">🍥</div>

      <h2 class="modal-title" id="modal-title">
      </h2>

      </p>

      <a href="" class="enter-group-btn" target="_blank" rel="noopener noreferrer">
        <span>🎯</span> SHORTLY
      </a>
    </div>
  </div>

  <script>
    const modal = document.getElementById('more-games-modal');
    const openButton = document.getElementById('open-modal');
    const closeButton = document.getElementById('close-modal');

    function openModal() {
      modal.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('is-open');
      document.body.style.overflow = '';
    }

    openButton.addEventListener('click', openModal);
    closeButton.addEventListener('click', closeModal);

    modal.addEventListener('click', function(event) {
      if (event.target === modal) closeModal();
    });

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeModal();
    });

    const field = document.querySelector('.star-field');

    for (let i = 0; i < 42; i++) {
      const star = document.createElement('span');
      star.style.left = `${(i * 37) % 100}%`;
      star.style.top = `${(i * 61) % 100}%`;
      star.style.animationDelay = `${(i % 7) * .35}s`;
      field.appendChild(star);
    }
  </script>
</body>
</html>
